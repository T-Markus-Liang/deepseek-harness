// ==================== 斗地主 - 游戏状态机 ====================

class Game {
  constructor() {
    this.reset();
    this.onStateChange = null; // 状态变更回调
    this.onBidEnd = null;      // 叫地主结束回调
    this.onPlayMade = null;    // 出牌回调
    this.onGameEnd = null;     // 游戏结束回调
  }

  reset() {
    // 每局随机抽取 2 个 AI 对手（带头像/性格/语音映射）
    const [opp1, opp2] = drawOpponents();
    this.players = [
      { name: '你', hand: [], isLandlord: false, role: 'farmer', avatar: '😎', personality: 'balanced', voice: 'human', charId: 'you' },
      { name: opp1.name, hand: [], isLandlord: false, role: 'farmer', avatar: opp1.avatar, personality: opp1.personality, voice: opp1.voice, charId: opp1.id, tag: opp1.tag },
      { name: opp2.name, hand: [], isLandlord: false, role: 'farmer', avatar: opp2.avatar, personality: opp2.personality, voice: opp2.voice, charId: opp2.id, tag: opp2.tag }
    ];
    this.landlordCards = [];
    this.currentPlayer = 0;
    this.lastPlay = null;       // { player, cards, type, rank, length }
    this.lastPlayer = -1;       // 上一手出牌的人
    this.passCount = 0;         // 连续过牌次数
    this.phase = 'idle';        // idle | dealing | bidding | playing | ended
    this.bidHistory = [];       // [{ player, score }]
    this.bidCount = 0;          // 叫地主轮数
    this.landlord = -1;         // 地主索引
    this.winner = null;         // 赢家
    this.playHistory = [];      // 出牌历史
    this.selectedCards = [];    // 当前选中牌
    this.validPlays = [];       // 当前可出的牌
    this.hintIndex = 0;         // 提示索引
    this.deck = [];
    this.dealt = false;
  }

  /**
   * 开始新游戏
   */
  startGame() {
    this.reset();
    this.phase = 'dealing';
    
    // 洗牌发牌
    this.deck = createDeck();
    const [p0, p1, p2, landlord] = deal(this.deck);
    this.players[0].hand = sortCards(p0);
    this.players[1].hand = sortCards(p1);
    this.players[2].hand = sortCards(p2);
    this.landlordCards = landlord;
    this.dealt = true;
    
    this._notifyState();
    
    // 进入叫地主阶段
    setTimeout(() => this.startBidding(), 800);
  }

  /**
   * 开始叫地主
   */
  startBidding() {
    this.phase = 'bidding';
    this.bidCount = 0;
    this.bidHistory = [];
    
    // 随机选择开始叫牌的玩家
    this.currentPlayer = Math.floor(Math.random() * 3);
    this._notifyState();
  }

  /**
   * 处理叫分
   * @param {number} playerIndex - 玩家索引
   * @param {number} score - 叫分 (0=不叫, 1=1分, 2=2分, 3=3分)
   */
  handleBid(playerIndex, score) {
    if (this.phase !== 'bidding') return false;
    if (playerIndex !== this.currentPlayer) return false;
    
    this.bidHistory.push({ player: playerIndex, score });
    this.bidCount++;
    
    // 如果叫了3分，直接成为地主
    if (score === 3) {
      this._setLandlord(playerIndex);
      return true;
    }
    
    // 检查是否所有人都叫过了
    if (this.bidCount >= 3) {
      // 找最高分
      const maxBid = this.bidHistory.reduce((max, b) => b.score > max.score ? b : max, { score: 0 });
      if (maxBid.score > 0) {
        this._setLandlord(maxBid.player);
      } else {
        // 没人叫地主，重新发牌
        this._notifyState();
        setTimeout(() => this.startGame(), 500);
        return true;
      }
      return true;
    }
    
    // 下一家
    this.currentPlayer = (this.currentPlayer + 1) % 3;
    this._notifyState();
    return true;
  }

  /**
   * 设置地主
   */
  _setLandlord(playerIndex) {
    this.landlord = playerIndex;
    this.players[playerIndex].isLandlord = true;
    this.players[playerIndex].role = 'landlord';
    
    // 地主获得底牌
    this.players[playerIndex].hand = sortCards([...this.players[playerIndex].hand, ...this.landlordCards]);
    
    this.phase = 'playing';
    this.currentPlayer = playerIndex;
    this.lastPlay = null;
    this.lastPlayer = -1;
    this.passCount = 0;
    
    this._notifyState();
    
    if (this.onBidEnd) {
      this.onBidEnd(playerIndex);
    }
  }

  /**
   * 处理出牌
   * @param {number} playerIndex - 玩家索引
   * @param {Array} cards - 出的牌
   * @returns {boolean} 是否合法
   */
  handlePlay(playerIndex, cards) {
    if (this.phase !== 'playing') return false;
    if (playerIndex !== this.currentPlayer) return false;
    
    const isPass = !cards || cards.length === 0;
    
    if (isPass) {
      // 不能过牌（上一轮是自己出的，或者没人出牌）
      if (this.lastPlayer === playerIndex || this.lastPlayer === -1) {
        return false;
      }
      this.passCount++;
      this._notifyState();
      this._nextPlayer();
      return true;
    }
    
    // 验证牌是否在手牌中
    const handCopy = [...this.players[playerIndex].hand];
    for (const card of cards) {
      const idx = handCopy.findIndex(c => c.suit === card.suit && c.rank === card.rank);
      if (idx === -1) return false;
      handCopy.splice(idx, 1);
    }
    
    // 检测牌型
    const type = detectType(cards);
    if (!type) return false;
    
    // 检查是否能管上
    const lastPlayObj = this.lastPlayer === playerIndex ? null : this.lastPlay;
    if (lastPlayObj && lastPlayObj.player !== playerIndex) {
      const lastPlayInfo = { cards: lastPlayObj.cards, type: lastPlayObj.type, rank: lastPlayObj.rank, length: lastPlayObj.length };
      if (!canBeat(cards, lastPlayInfo)) return false;
    }
    
    // 出牌合法，更新状态
    this.players[playerIndex].hand = handCopy;
    this.lastPlay = {
      player: playerIndex,
      cards: cards,
      type: type.type,
      rank: type.rank,
      length: type.length
    };
    this.lastPlayer = playerIndex;
    this.passCount = 0;
    this.playHistory.push({ player: playerIndex, cards, type: type.type });
    
    this._notifyState();
    
    // 检查是否出完
    if (this.players[playerIndex].hand.length === 0) {
      this.phase = 'ended';
      this.winner = playerIndex;
      this._notifyState();
      if (this.onGameEnd) {
        this.onGameEnd(playerIndex);
      }
      return true;
    }
    
    this._nextPlayer();
    return true;
  }

  /**
   * 下一个玩家
   */
  _nextPlayer() {
    this.currentPlayer = (this.currentPlayer + 1) % 3;
    
    // 如果已经有两人过牌，且上一手出牌的人是自己，清空 lastPlay
    if (this.passCount >= 2) {
      this.lastPlayer = this.currentPlayer;
      this.lastPlay = null;
      this.passCount = 0;
    }
    
    this._notifyState();
  }

  /**
   * 获取当前状态快照
   */
  getState() {
    return {
      players: this.players.map(p => ({
        name: p.name,
        handCount: p.hand.length,
        hand: p.hand,
        isLandlord: p.isLandlord,
        role: p.role,
        avatar: p.avatar,
        personality: p.personality,
        voice: p.voice,
        tag: p.tag,
        charId: p.charId
      })),
      landlordCards: this.landlordCards,
      currentPlayer: this.currentPlayer,
      lastPlay: this.lastPlay,
      lastPlayer: this.lastPlayer,
      phase: this.phase,
      bidHistory: this.bidHistory,
      landlord: this.landlord,
      winner: this.winner,
      isCurrentPlayerHuman: this.currentPlayer === 0 && this.phase === 'playing'
    };
  }

  /**
   * 获取当前可出的牌（用于提示）
   */
  getValidPlays() {
    if (this.phase !== 'playing') return [];
    const hand = this.players[this.currentPlayer].hand;
    const lastPlay = this.lastPlayer === this.currentPlayer ? null : this.lastPlay;
    return findValidPlays(hand, lastPlay);
  }

  /**
   * 通知状态变更
   */
  _notifyState() {
    if (this.onStateChange) {
      this.onStateChange(this.getState());
    }
  }
}

// ==================== 斗地主 - AI 策略 ====================

/**
 * AI 策略模块
 */

/**
 * 评估手牌质量，决定叫分（按性格调整）
 * @param {Array} hand - 手牌
 * @param {number} currentBid - 当前最高叫分
 * @param {string} personality - 性格（aggressive/balanced/conservative）
 * @returns {number} 叫分 (0-3)
 */
function decideBid(hand, currentBid, personality) {
  if (currentBid >= 3) return 0;
  
  let score = 0;
  const countMap = getCountMap(hand);
  
  // 炸弹加分
  for (const [rank, count] of Object.entries(countMap)) {
    if (count === 4) score += 6;
  }
  
  // 王加分
  if (hand.some(c => c.rank === 17)) score += 4; // 大王
  if (hand.some(c => c.rank === 16)) score += 3; // 小王
  
  // 2加分
  const twoCount = countMap[15] || 0;
  score += twoCount * 2;
  
  // A加分
  const aceCount = countMap[14] || 0;
  score += aceCount * 1;
  
  // 牌总数多也加分
  if (hand.length >= 17) score += 1;
  
  // 性格调整：激进爱叫地主 / 保守少叫
  const params = PERSONALITY_PARAMS[personality] || PERSONALITY_PARAMS['balanced'];
  score += params.bidBonus;
  
  // 决定叫分
  if (score >= 12) return 3;
  if (score >= 8) return 2;
  if (score >= 5) return 1;
  return 0;
}

/**
 * AI 选择要出的牌
 * @param {Array} hand - 手牌
 * @param {Object|null} lastPlay - 上一手牌
 * @param {number} lastPlayer - 上一手出牌的人
 * @param {boolean} isLandlord - 是否是地主
 * @param {number} currentPlayer - 当前玩家索引
 * @returns {Array|null} 要出的牌，或 null 表示过牌
 */
function choosePlay(hand, lastPlay, lastPlayer, isLandlord, currentPlayer, landlord, personality) {
  const validPlays = findValidPlays(hand, lastPlay);
  
  if (validPlays.length === 0) return null;
  
  if (!lastPlay || !lastPlay.cards || lastPlay.cards.length === 0) {
    // 自由出牌
    return chooseFreePlay(hand, validPlays, isLandlord, personality);
  } else {
    // 跟牌
    return chooseFollowPlay(hand, validPlays, lastPlay, lastPlayer, isLandlord, currentPlayer, landlord, personality);
  }
}

/**
 * 自由出牌策略（按性格调整：激进早出大牌/炸弹，保守留大牌）
 */
function chooseFreePlay(hand, validPlays, isLandlord, personality) {
  const params = PERSONALITY_PARAMS[personality] || PERSONALITY_PARAMS['balanced'];
  // 按牌型分组
  const grouped = {
    singles: [],
    pairs: [],
    triples: [],
    tripleOnes: [],
    tripleTwos: [],
    straights: [],
    doubleStraights: [],
    planes: [],
    planeSingles: [],
    planePairs: [],
    bombs: [],
    rockets: [],
    fourTwos: []
  };
  
  for (const play of validPlays) {
    const type = detectType(play);
    if (!type) continue;
    switch (type.type) {
      case CARD_TYPE.SINGLE: grouped.singles.push(play); break;
      case CARD_TYPE.PAIR: grouped.pairs.push(play); break;
      case CARD_TYPE.TRIPLE: grouped.triples.push(play); break;
      case CARD_TYPE.TRIPLE_ONE: grouped.tripleOnes.push(play); break;
      case CARD_TYPE.TRIPLE_TWO: grouped.tripleTwos.push(play); break;
      case CARD_TYPE.STRAIGHT: grouped.straights.push(play); break;
      case CARD_TYPE.DOUBLE_STRAIGHT: grouped.doubleStraights.push(play); break;
      case CARD_TYPE.PLANE: grouped.planes.push(play); break;
      case CARD_TYPE.PLANE_SINGLE: grouped.planeSingles.push(play); break;
      case CARD_TYPE.PLANE_PAIR: grouped.planePairs.push(play); break;
      case CARD_TYPE.BOMB: grouped.bombs.push(play); break;
      case CARD_TYPE.ROCKET: grouped.rockets.push(play); break;
      case CARD_TYPE.FOUR_TWO: grouped.fourTwos.push(play); break;
    }
  }
  
  // 如果手牌很少（<=4张），直接出大牌
  if (hand.length <= 4) {
    // 有火箭先出火箭
    if (grouped.rockets.length > 0) return grouped.rockets[0];
    // 有炸弹出炸弹（激进型更早炸）
    if (grouped.bombs.length > 0 && (personality === 'aggressive' || hand.length <= 2 || Math.random() < params.bombBias)) {
      return grouped.bombs[0];
    }
    // 出最大的牌型
    for (const play of validPlays) {
      if (play.length === hand.length) return play;
    }
  }
  
  // 优先出小牌
  
  // 1. 出顺子（如果有较长的顺子）
  if (grouped.straights.length > 0) {
    // 选最小的顺子
    const minStraight = grouped.straights.reduce((min, p) => {
      const type = detectType(p);
      return type.rank < detectType(min).rank ? p : min;
    });
    return minStraight;
  }
  
  // 2. 出连对
  if (grouped.doubleStraights.length > 0) {
    const minDS = grouped.doubleStraights.reduce((min, p) => {
      const type = detectType(p);
      return type.rank < detectType(min).rank ? p : min;
    });
    return minDS;
  }
  
  // 3. 出飞机
  if (grouped.planes.length > 0) {
    return grouped.planes[0];
  }
  if (grouped.planeSingles.length > 0) {
    return grouped.planeSingles[0];
  }
  if (grouped.planePairs.length > 0) {
    return grouped.planePairs[0];
  }
  
  // 4. 出三带（先出最小的）
  if (grouped.tripleOnes.length > 0) {
    return grouped.tripleOnes[grouped.tripleOnes.length - 1];
  }
  if (grouped.tripleTwos.length > 0) {
    return grouped.tripleTwos[grouped.tripleTwos.length - 1];
  }
  if (grouped.triples.length > 0) {
    return grouped.triples[grouped.triples.length - 1];
  }
  
  // 5. 出对子（先出小对）
  if (grouped.pairs.length > 0) {
    // findValidPlays生成顺序是降序，取最后一个（最小）
    return grouped.pairs[grouped.pairs.length - 1];
  }
  
  // 6. 出单张（先出最小单张）
  if (grouped.singles.length > 0) {
    // findValidPlays生成顺序是降序，取最后一个（最小）
    return grouped.singles[grouped.singles.length - 1];
  }
  
  // 7. 出四带二
  if (grouped.fourTwos.length > 0) {
    return grouped.fourTwos[grouped.fourTwos.length - 1];
  }
  
  // 8. 出炸弹（激进型提前炸抢牌权；稳健/保守留到最后）
  if (grouped.bombs.length > 0) {
    // 激进：有炸弹就喜欢炸（约 60% 概率提前出）
    if (personality === 'aggressive' && Math.random() < 0.6) {
      return grouped.bombs[grouped.bombs.length - 1];
    }
    if (personality !== 'conservative' && Math.random() < 0.2) {
      return grouped.bombs[grouped.bombs.length - 1];
    }
  }
  if (grouped.rockets.length > 0 && personality !== 'conservative') {
    return grouped.rockets[grouped.rockets.length - 1];
  }
  
  return validPlays[0];
}

/**
 * 跟牌策略（按性格调整）
 */
function chooseFollowPlay(hand, validPlays, lastPlay, lastPlayer, isLandlord, currentPlayer, landlord, personality) {
  const params = PERSONALITY_PARAMS[personality] || PERSONALITY_PARAMS['balanced'];
  
  // 判断上一手出牌的人是不是队友
  let isPartner = false;
  if (!isLandlord) {
    // AI是农民，队友是另一个农民（非地主非自己）
    const partnerIndex = [0, 1, 2].find(i => i !== currentPlayer && i !== landlord);
    isPartner = lastPlayer === partnerIndex;
  }
  // 地主没有队友，所以 isPartner 保持 false
  
  // 队友出的牌：激进型继续跟（抢出牌权），稳健/保守让队友走
  if (isPartner) {
    // 如果手牌很少，有机会出完，就继续出
    if (hand.length <= 3) {
      // 找最小的能管上的牌
      return validPlays[validPlays.length - 1];
    }
    // 激进型：即使队友出牌也想出牌（减少过牌）
    if (personality === 'aggressive' && Math.random() < 0.5) {
      return validPlays[validPlays.length - 1];
    }
    // 否则过牌，让队友继续
    return null;
  }
  
  // 对手出的牌，尽量管上
  
  // 按 rank 分类
  const playsByRank = {};
  for (const play of validPlays) {
    const type = detectType(play);
    if (type) {
      const key = `${type.type}_${type.rank}`;
      if (!playsByRank[key]) playsByRank[key] = [];
      playsByRank[key].push(play);
    }
  }
  
  // 分离炸弹和普通牌
  const normalPlays = [];
  const bombPlays = [];
  const rocketPlays = [];
  
  for (const play of validPlays) {
    const type = detectType(play);
    if (!type) continue;
    if (type.type === CARD_TYPE.ROCKET) {
      rocketPlays.push(play);
    } else if (type.type === CARD_TYPE.BOMB) {
      bombPlays.push(play);
    } else {
      normalPlays.push(play);
    }
  }
  
  // 保守型：对手出大牌时，普通牌管不上就过（保留炸弹，不硬管）
  if (personality === 'conservative' && normalPlays.length > 0) {
    const lastType = detectType(lastPlay.cards);
    const lastRank = lastType ? lastType.rank : 0;
    // 如果对手出的牌很大（rank > 12），保守型倾向过牌保留炸弹
    if (lastRank > 12 && bombPlays.length > 0 && hand.length > 4 && Math.random() < 0.6) {
      return null;
    }
  }
  
  // 优先用普通牌管上，保留炸弹和火箭
  if (normalPlays.length > 0) {
    // 选择最小的能管上的牌（findValidPlays生成顺序是降序，取最后一个）
    const lastType = detectType(lastPlay.cards);
    if (lastType && lastType.type === CARD_TYPE.SINGLE) {
      // 找最小的单张
      return normalPlays[normalPlays.length - 1];
    }
    // 针对对子：用最小的对子管
    if (lastType && lastType.type === CARD_TYPE.PAIR) {
      return normalPlays[normalPlays.length - 1];
    }
    // 一般情况，用最小的管上
    return normalPlays[normalPlays.length - 1];
  }
  
  // 如果手牌很少（<=2张），可以考虑用炸弹抢出牌权
  if (hand.length <= 4 && bombPlays.length > 0) {
    return bombPlays[0];
  }
  
  // 如果对方只剩很少牌，用炸弹抢牌权
  // （简化版：不跟踪对手剩余牌数，直接判断）
  if (bombPlays.length > 0 && hand.length <= 6) {
    return bombPlays[0];
  }
  
  // 用炸弹（如果对方出的不是炸弹）
  const lastPlayType = lastPlay.type || detectType(lastPlay.cards);
  if (lastPlayType && lastPlayType.type !== CARD_TYPE.BOMB && lastPlayType.type !== CARD_TYPE.ROCKET) {
    if (bombPlays.length > 0) {
      // 使用最小的炸弹
      return bombPlays[bombPlays.length - 1];
    }
  } else if (lastPlayType && lastPlayType.type === CARD_TYPE.BOMB) {
    // 对方出炸弹，用更大的炸弹或火箭
    if (rocketPlays.length > 0) return rocketPlays[rocketPlays.length - 1];
    if (bombPlays.length > 0) return bombPlays[bombPlays.length - 1];
  }
  
  // 真的管不上，过牌
  return null;
}

/**
 * 获取AI出牌延迟（毫秒）
 */
function getAIDelay() {
  return 800 + Math.random() * 600;
}

/**
 * 获取AI叫牌延迟
 */
function getAIBidDelay() {
  return 500 + Math.random() * 500;
}

// ==================== 斗地主 - UI 渲染 ====================

class Renderer {
  constructor() {
    // DOM 缓存
    this.el = {};
    this.el.gameTable = document.getElementById('game-table');
    this.el.playerAreas = [
      document.getElementById('player-0'),
      document.getElementById('player-1'),
      document.getElementById('player-2')
    ];
    this.el.playArea = document.getElementById('play-area');
    this.el.playFront0 = document.getElementById('play-front-0');
    this.el.playFront1 = document.getElementById('play-front-1');
    this.el.playFront2 = document.getElementById('play-front-2');
    this.el.landlordCards = document.getElementById('landlord-cards');
    this.el.handCards = document.getElementById('hand-cards');
    this.el.controls = document.getElementById('controls');
    this.el.bidControls = document.getElementById('bid-controls');
    this.el.gameStatus = document.getElementById('game-status');
    this.el.infoPanel = document.getElementById('info-panel');
    this.el.bgmToggle = document.getElementById('bgm-toggle');
    this.el.restartBtn = document.getElementById('restart-btn');
    this.el.playHistory = document.getElementById('history-list');
    
    // 本局出牌历史
    this._historyCleared = false;
    
    // 当前出牌区显示的牌（player + 牌key），用于判断是否需要更新（pass 时保留旧牌）
    this._displayedPlayKey = null;
    
    // 出牌堆永久累积，不清空（玩家出的牌一直留在桌上，直到新一局/游戏结束才收走）
    this._roundEnded = false;
    
    // 玩家信息DOM
    this.el.playerInfo = [
      this.el.playerAreas[0].querySelector('.player-info'),
      this.el.playerAreas[1].querySelector('.player-info'),
      this.el.playerAreas[2].querySelector('.player-info')
    ];
    
    // 出牌区：中间堆放容器（真实打牌，牌凌乱堆在桌中间）
    this.el.playStack = this.el.playArea.querySelector('#play-stack');
    
    // 回调
    this.onPlay = null;
    this.onPass = null;
    this.onBid = null;
    this.onHint = null;
    
    // 当前选中的牌
    this.selectedIndices = new Set();
    this.currentHand = [];
    
    // 音量滑块
    this.el.bgmVolume = document.getElementById('bgm-volume');
    
    // 绑定事件
    this._bindEvents();
  }

  /**
   * 渲染完整游戏状态
   */
  renderState(state) {
    this.renderPlayerInfo(0, state.players[0]);
    this.renderPlayerInfo(1, state.players[1]);
    this.renderPlayerInfo(2, state.players[2]);
    
    // 新一局开始时清空出牌历史
    if (state.phase === 'bidding') {
      if (!this._historyCleared) {
        this._historyCleared = true;
        this.clearPlayHistory();
      }
    } else {
      this._historyCleared = false;
    }
    
    // 底牌（只有地主确定后才显示）
    if (state.landlord !== -1) {
      this.renderLandlordCards(state.landlordCards, true);
    } else {
      this.renderLandlordCards(state.landlordCards, false);
    }
    
    // 玩家手牌
    this.renderPlayerHand(0, state.players[0].hand, state.currentPlayer === 0);
    
    // 出牌区
    this.renderPlayArea(state);
    
    // 状态消息
    this.updateStatus(state);
    
    // 高亮当前玩家
    this._highlightCurrentPlayer(state.currentPlayer, state.phase);
    
    // 显示叫地主UI
    if (state.phase === 'bidding' && state.currentPlayer === 0) {
      this.showBiddingUI(state);
    } else {
      this.hideBiddingUI();
    }
    
    // 显示/隐藏出牌UI
    if (state.phase === 'playing') {
      const isHuman = state.currentPlayer === 0;
      if (isHuman) {
        const validPlays = this._getValidPlaysForUI(state);
        this.showPlayingUI(validPlays);
      } else {
        this.hidePlayingUI();
      }
    } else {
      this.hidePlayingUI();
    }
    
    // 显示胜利信息
    if (state.phase === 'ended') {
      this.showWinner(state);
    }
  }

  /**
   * 渲染玩家手牌
   */
  renderPlayerHand(playerIndex, cards, isCurrent) {
    if (playerIndex !== 0) return; // 只渲染人类玩家的手牌
    
    this.currentHand = cards;
    const container = this.el.handCards;
    container.innerHTML = '';
    
    if (!cards || cards.length === 0) return;
    
    const sorted = sortCards(cards);
    
    for (let i = 0; i < sorted.length; i++) {
      const card = sorted[i];
      const display = cardDisplay(card);
      const cardEl = document.createElement('div');
      cardEl.className = 'card';
      cardEl.dataset.index = i;
      
      if (this.selectedIndices.has(i)) {
        cardEl.classList.add('selected');
      }
      
      const isRed = display.isRed;
      const colorClass = isRed ? 'card-red' : 'card-black';
      
      if (card.suit === 'joker') {
        cardEl.classList.add('card-joker', card.rank === 17 ? 'card-red' : 'card-black');
        cardEl.innerHTML = `
          <div class="card-corner top-left">
            <span class="card-rank">${display.display}</span>
          </div>
          <div class="card-center">${card.rank === 17 ? '🃏👑' : '🃏'}</div>
          <div class="card-corner bottom-right">
            <span class="card-rank">${display.display}</span>
          </div>
        `;
      } else {
        cardEl.innerHTML = `
          <div class="card-corner top-left ${colorClass}">
            <span class="card-rank">${display.display}</span>
            <span class="card-suit">${display.suitSymbol}</span>
          </div>
          <div class="card-center ${colorClass}">${display.suitSymbol}</div>
          <div class="card-corner bottom-right ${colorClass}">
            <span class="card-rank">${display.display}</span>
            <span class="card-suit">${display.suitSymbol}</span>
          </div>
        `;
      }
      
      cardEl.addEventListener('click', () => this._handleCardClick(i));
      cardEl.addEventListener('mouseenter', () => {
        if (!this.selectedIndices.has(i)) {
          cardEl.classList.add('hover');
        }
      });
      cardEl.addEventListener('mouseleave', () => {
        cardEl.classList.remove('hover');
      });
      
      container.appendChild(cardEl);
    }
  }

  /**
   * 渲染出牌区（真实打牌模拟）
   * 一轮内：每家出的牌停留在各自前方展示位（人类=下方/AI-1=右侧/AI-2=左侧），整轮可见；
   * 下一轮开始（两人 pass 触发 lastPlay 清空）时，把上一轮各家面前的牌归入桌子中心散乱牌堆。
   */
  renderPlayArea(state) {
    // 新一局（叫牌阶段）或游戏结束：清空出牌区
    if (state.phase === 'bidding' || state.phase === 'ended') {
      if (this._displayedPlayKey !== null) this.clearPlayArea();
      return;
    }
    const lastPlay = state.lastPlay || null;
    // 新一轮开始（上一轮结束，lastPlay 被清空）：把上一轮各家前方的牌归入中心牌堆
    if (!lastPlay) {
      if (this._roundFrontNotEmpty()) {
        this._collectFrontToStack();
      }
      return;
    }
    const key = this._playKey(lastPlay);
    if (key === this._displayedPlayKey) return; // 已在 animatePlayCards 流程中
    // lastPlay 变化但未经过 animatePlayCards（防御性）：走"前方展示"流程
    this.animatePlayCards(lastPlay.player, lastPlay.cards);
    this._displayedPlayKey = key;
  }

  /**
   * 计算一手牌的唯一标识（用于判断出牌区是否需要更新）
   * 使用排序后的牌，避免出牌顺序差异导致出牌区误重建（牌闪烁）
   */
  _playKey(play) {
    if (!play || !play.cards) return null;
    return play.player + '|' + this._cardsKey(play.cards);
  }

  /**
   * 生成排序后的牌标识（花色→点数）
   */
  _cardsKey(cards) {
    return [...cards]
      .sort((a, b) => (a.suit === b.suit ? a.rank - b.rank : String(a.suit).localeCompare(String(b.suit))))
      .map(c => c.suit + ':' + c.rank).join(',');
  }

  /**
   * 把一手牌凌乱地丢到牌桌中间（真实打牌模拟）
   * 整手牌带随机偏移与旋转；每张牌再带微小的随机偏移/旋转，模拟散落
   */
  _addToStack(playerIndex, cards, type) {
    if (!this.el.playStack || !cards) return;

    // 真实打牌：牌凌乱堆在桌中间。
    // 用行列基础位置（避免全叠成一团不可见）+ 每手大幅随机抖动/旋转（凌乱自然）
    const existing = this.el.playStack.querySelectorAll('.played-hand').length;
    const col = existing % 3;
    const row = Math.floor(existing / 3) % 2;
    const baseX = (col - 1) * 130;         // 列基础偏移：-130 / 0 / +130
    const baseY = (row === 0 ? -35 : 35);  // 行基础偏移：上排 -35 / 下排 +35
    const dx = baseX + (Math.random() - 0.5) * 90;   // 大幅随机抖动 ±45
    const dy = baseY + (Math.random() - 0.5) * 60;   // ±30
    const rot = (Math.random() - 0.5) * 28;          // -14° ~ +14° 随机旋转
    const hand = document.createElement('div');
    hand.className = 'played-hand';
    hand.style.transform = `translate(calc(-50% + ${dx.toFixed(1)}px), calc(-50% + ${dy.toFixed(1)}px)) rotate(${rot.toFixed(1)}deg)`;

    const inner = document.createElement('div');
    inner.className = 'played-hand-inner';

    for (const card of cards) {
      const display = cardDisplay(card);
      const isRed = display.isRed;
      const colorClass = isRed ? 'card-red' : 'card-black';
      const cardEl = document.createElement('div');
      cardEl.className = 'card card-small card-animate-in';

      // 每张牌微小的随机偏移与旋转（更凌乱自然）
      const crot = (Math.random() - 0.5) * 14;
      const cx = (Math.random() - 0.5) * 10;
      const cy = (Math.random() - 0.5) * 10;
      cardEl.style.transform = `translate(${cx.toFixed(1)}px, ${cy.toFixed(1)}px) rotate(${crot.toFixed(1)}deg)`;

      if (card.suit === 'joker') {
        cardEl.classList.add('card-joker', card.rank === 17 ? 'card-red' : 'card-black');
        cardEl.innerHTML = `
          <div class="card-corner top-left">
            <span class="card-rank">${display.display}</span>
          </div>
          <div class="card-center">${card.rank === 17 ? '🃏👑' : '🃏'}</div>
        `;
      } else {
        cardEl.innerHTML = `
          <div class="card-corner top-left ${colorClass}">
            <span class="card-rank">${display.display}</span>
            <span class="card-suit">${display.suitSymbol}</span>
          </div>
          <div class="card-center ${colorClass}">${display.suitSymbol}</div>
        `;
      }

      inner.appendChild(cardEl);
    }

    hand.appendChild(inner);

    // 牌型标签（提示出的什么牌型）
    if (type != null) {
      const typeName = getTypeName(type);
      const label = document.createElement('div');
      label.className = 'play-type-label';
      label.textContent = typeName;
      hand.appendChild(label);
    }

    this.el.playStack.appendChild(hand);
  }

  /**
   * 渲染底牌
   */
  renderLandlordCards(cards, showFace) {
    const container = this.el.landlordCards;
    container.innerHTML = '';
    
    if (!cards || cards.length === 0) return;
    
    for (const card of cards) {
      const cardEl = document.createElement('div');
      cardEl.className = 'card card-small';
      
      if (showFace) {
        const display = cardDisplay(card);
        const isRed = display.isRed;
        const colorClass = isRed ? 'card-red' : 'card-black';
        
        if (card.suit === 'joker') {
          cardEl.classList.add('card-joker', card.rank === 17 ? 'card-red' : 'card-black');
          cardEl.innerHTML = `
            <div class="card-corner top-left">
              <span class="card-rank">${display.display}</span>
            </div>
            <div class="card-center">${card.rank === 17 ? '🃏👑' : '🃏'}</div>
          `;
        } else {
          cardEl.innerHTML = `
            <div class="card-corner top-left ${colorClass}">
              <span class="card-rank">${display.display}</span>
              <span class="card-suit">${display.suitSymbol}</span>
            </div>
            <div class="card-center ${colorClass}">${display.suitSymbol}</div>
          `;
        }
      } else {
        cardEl.classList.add('card-back');
        cardEl.innerHTML = '<div class="card-back-pattern">🂠</div>';
      }
      
      container.appendChild(cardEl);
    }
  }

  /**
   * 渲染玩家信息
   */
  renderPlayerInfo(playerIndex, player) {
    const info = this.el.playerInfo[playerIndex];
    if (!info) return;
    
    const roleIcon = player.role === 'landlord' ? '👑' : '🌾';
    const roleText = player.role === 'landlord' ? '地主' : '农民';
    const avatar = player.avatar || (playerIndex === 0 ? '😎' : '🤖');
    const tag = player.tag ? `<span class="player-tag">${player.tag}</span>` : '';
    
    info.innerHTML = `
      <div class="player-avatar" style="background-color: ${this._getAvatarColor(playerIndex)}">
        ${avatar}
      </div>
      <div class="player-details">
        <div class="player-name">${player.name} ${tag}</div>
        <div class="player-role">${roleIcon} ${roleText}</div>
        <div class="player-cards-count">剩余: ${player.handCount}张</div>
      </div>
    `;
  }

  /**
   * 显示叫地主UI
   */
  showBiddingUI(state) {
    const container = this.el.bidControls;
    container.style.display = 'flex';
    container.innerHTML = '';
    
    const title = document.createElement('div');
    title.className = 'bid-title';
    title.textContent = '叫地主';
    container.appendChild(title);
    
    const buttonsDiv = document.createElement('div');
    buttonsDiv.className = 'bid-buttons';
    
    // 不叫
    const passBtn = document.createElement('button');
    passBtn.className = 'btn btn-pass';
    passBtn.textContent = '不叫';
    passBtn.addEventListener('click', () => {
      if (this.onBid) this.onBid(0);
    });
    buttonsDiv.appendChild(passBtn);
    
    // 1分
    if (state.bidHistory.length === 0 || state.bidHistory.every(b => b.score < 1)) {
      const b1 = document.createElement('button');
      b1.className = 'btn btn-bid';
      b1.textContent = '1分';
      b1.addEventListener('click', () => {
        if (this.onBid) this.onBid(1);
      });
      buttonsDiv.appendChild(b1);
    }
    
    // 2分
    if (state.bidHistory.length === 0 || state.bidHistory.every(b => b.score < 2)) {
      const b2 = document.createElement('button');
      b2.className = 'btn btn-bid';
      b2.textContent = '2分';
      b2.addEventListener('click', () => {
        if (this.onBid) this.onBid(2);
      });
      buttonsDiv.appendChild(b2);
    }
    
    // 3分
    if (state.bidHistory.length === 0 || state.bidHistory.every(b => b.score < 3)) {
      const b3 = document.createElement('button');
      b3.className = 'btn btn-bid-high';
      b3.textContent = '3分';
      b3.addEventListener('click', () => {
        if (this.onBid) this.onBid(3);
      });
      buttonsDiv.appendChild(b3);
    }
    
    container.appendChild(buttonsDiv);
    
    // 显示叫牌历史
    const historyDiv = document.createElement('div');
    historyDiv.className = 'bid-history';
    for (const bid of state.bidHistory) {
      const p = document.createElement('span');
      p.textContent = `${state.players[bid.player].name}: ${bid.score > 0 ? bid.score + '分' : '不叫'}`;
      historyDiv.appendChild(p);
    }
    container.appendChild(historyDiv);
  }

  /**
   * 隐藏叫地主UI
   */
  hideBiddingUI() {
    this.el.bidControls.style.display = 'none';
  }

  /**
   * 显示出牌UI
   */
  showPlayingUI(validPlays) {
    const container = this.el.controls;
    container.style.display = 'flex';
    container.innerHTML = '';
    
    // 出牌按钮
    const playBtn = document.createElement('button');
    playBtn.className = 'btn btn-play';
    playBtn.textContent = '出牌';
    playBtn.addEventListener('click', () => {
      if (this.selectedIndices.size === 0) return;
      const selectedCards = this._getSelectedCards();
      if (this.onPlay) this.onPlay(selectedCards);
    });
    container.appendChild(playBtn);
    
    // 不出按钮
    const passBtn = document.createElement('button');
    passBtn.className = 'btn btn-pass';
    passBtn.textContent = '不出';
    passBtn.addEventListener('click', () => {
      if (this.onPass) this.onPass();
    });
    container.appendChild(passBtn);
    
    // 提示按钮
    const hintBtn = document.createElement('button');
    hintBtn.className = 'btn btn-hint';
    hintBtn.textContent = '提示';
    hintBtn.addEventListener('click', () => {
      if (this.onHint) this.onHint();
    });
    container.appendChild(hintBtn);
  }

  /**
   * 隐藏出牌UI
   */
  hidePlayingUI() {
    this.el.controls.style.display = 'none';
  }

  /**
   * 显示消息
   */
  showMessage(text) {
    this.el.gameStatus.textContent = text;
    this.el.gameStatus.classList.add('show');
  }

  /**
   * 显示胜利信息
   */
  showWinner(state) {
    const winner = state.winner;
    if (winner === null) return;
    
    const winnerName = state.players[winner].name;
    const isLandlordWin = state.players[winner].isLandlord;
    const team = isLandlordWin ? '地主' : '农民';
    
    this.showMessage(`🎉 ${winnerName} 获胜！${team}方胜利！🎉`);
    
    // 创建胜利动画
    const overlay = document.createElement('div');
    overlay.className = 'victory-overlay';
    overlay.innerHTML = `
      <div class="victory-content">
        <div class="victory-icon">🏆</div>
        <div class="victory-title">${winnerName} 获胜！</div>
        <div class="victory-team">${team}方赢了！</div>
        <button class="btn btn-restart" onclick="location.reload()">再来一局</button>
      </div>
    `;
    document.body.appendChild(overlay);
    
    // 创建彩纸效果
    this._createConfetti();
  }

  /**
   * 更新状态消息
   */
  updateStatus(state) {
    let msg = '';
    
    switch (state.phase) {
      case 'idle':
        msg = '点击"开始游戏"';
        break;
      case 'dealing':
        msg = '发牌中...';
        break;
      case 'bidding': {
        const currentName = state.players[state.currentPlayer].name;
        msg = `叫地主阶段 - ${currentName} 叫分`;
        break;
      }
      case 'playing': {
        const currentName = state.players[state.currentPlayer].name;
        const landlordName = state.landlord !== -1 ? state.players[state.landlord].name : '';
        msg = `${landlordName}是地主 | 当前: ${currentName} 出牌`;
        break;
      }
      case 'ended':
        msg = '游戏结束';
        break;
    }
    
    this.showMessage(msg);
  }

  /**
   * 出牌动画（复刻真实打牌）：
   * 1) 牌出现在出牌者前方（人类=下方 / AI-1=右侧 / AI-2=左侧）展示这一手
   * 2) 整轮停留在各自前方（不清空、不自动消失）
   * 3) 下一轮开始时由 renderPlayArea 统一归入中心散乱牌堆
   */
  animatePlayCards(playerIndex, cards) {
    if (this.el.playStack == null) return;
    
    // 记录到顶部出牌历史
    this.addToHistory(playerIndex, cards);
    
    // 在出牌者前方展示这一手（覆盖该玩家上一轮已归堆的旧牌，只保留当前这手）
    const frontEl = this.el['playFront' + playerIndex];
    if (frontEl) {
      this._showPlayFront(frontEl, cards);
    }
    // 记录已展示，避免 renderPlayArea 重复触发同一手
    this._displayedPlayKey = playerIndex + '|' + this._cardsKey(cards);
  }

  /**
   * 在玩家前方展示位显示这一手牌
   */
  _showPlayFront(frontEl, cards) {
    frontEl.innerHTML = '';
    for (const card of cards) {
      const display = cardDisplay(card);
      const isRed = display.isRed;
      const colorClass = isRed ? 'card-red' : 'card-black';
      const cardEl = document.createElement('div');
      cardEl.className = 'card card-animate-in';
      // 记录牌数据，供新一轮归堆时 _readFrontCards 反解
      cardEl.setAttribute('data-rank', String(card.rank));
      cardEl.setAttribute('data-suit', card.suit);
      if (card.suit === 'joker') {
        cardEl.classList.add('card-joker', card.rank === 17 ? 'card-red' : 'card-black');
        cardEl.innerHTML = `
          <div class="card-corner top-left"><span class="card-rank">${display.display}</span></div>
          <div class="card-center">${card.rank === 17 ? '🃏👑' : '🃏'}</div>
          <div class="card-corner bottom-right"><span class="card-rank">${display.display}</span></div>
        `;
      } else {
        cardEl.innerHTML = `
          <div class="card-corner top-left ${colorClass}">
            <span class="card-rank">${display.display}</span>
            <span class="card-suit">${display.suitSymbol}</span>
          </div>
          <div class="card-center ${colorClass}">${display.suitSymbol}</div>
          <div class="card-corner bottom-right ${colorClass}">
            <span class="card-rank">${display.display}</span>
            <span class="card-suit">${display.suitSymbol}</span>
          </div>
        `;
      }
      frontEl.appendChild(cardEl);
    }
    frontEl.classList.add('show');
  }

  /**
   * 检查是否还有玩家前方展示着本轮的牌
   */
  _roundFrontNotEmpty() {
    for (let i = 0; i < 3; i++) {
      const frontEl = this.el['playFront' + i];
      if (frontEl && frontEl.querySelectorAll('.card').length > 0) return true;
    }
    return false;
  }

  /**
   * 把各家前方展示的牌归入中心散乱牌堆（下一轮开始调用）
   * 依次加入中心堆（随机位置/旋转散乱堆叠），然后清空所有前方展示位
   */
  _collectFrontToStack() {
    for (let i = 0; i < 3; i++) {
      const frontEl = this.el['playFront' + i];
      if (!frontEl) continue;
      const cards = this._readFrontCards(frontEl);
      if (cards.length > 0) {
        const t = detectType(cards);
        this._addToStack(i, cards, t ? t.type : null);
      }
      frontEl.classList.remove('show');
      frontEl.innerHTML = '';
    }
    // 牌堆上限控制
    this._trimStack();
  }

  /**
   * 从前方展示位读取牌数据（从 DOM 反解，补充 display 字段供 cardDisplay 显示）
   */
  _readFrontCards(frontEl) {
    const cards = [];
    const cardEls = frontEl.querySelectorAll('.card');
    for (const el of cardEls) {
      const rank = el.getAttribute('data-rank');
      const suit = el.getAttribute('data-suit');
      if (rank != null && suit != null) {
        const r = parseInt(rank, 10);
        cards.push({ rank: r, suit, display: RANK_DISPLAY[r] || (r === 16 ? '小王' : r === 17 ? '大王' : String(r)) });
      }
    }
    return cards;
  }

  /**
   * 牌堆上限控制：超过 15 手时最旧一手淡出移除
   * （一局最多 3 人 × 手牌 20 张，通常 15-20 手；保留最近 15 手足够看清）
   */
  _trimStack() {
    if (!this.el.playStack) return;
    const MAX_HANDS = 15;
    const hands = this.el.playStack.querySelectorAll('.played-hand');
    if (hands.length <= MAX_HANDS) return;
    const oldest = hands[0];
    oldest.classList.add('played-hand-fade-out');
    oldest.addEventListener('animationend', () => oldest.remove(), { once: true });
    // 兜底：动画未触发也移除
    setTimeout(() => { if (oldest.parentNode) oldest.remove(); }, 700);
  }

  /**
   * 清空出牌区（牌堆 + 玩家前方展示位）
   */
  clearPlayArea() {
    this._displayedPlayKey = null;
    if (this.el.playStack) {
      this.el.playStack.innerHTML = '';
    }
    for (let i = 0; i < 3; i++) {
      const frontEl = this.el['playFront' + i];
      if (frontEl) {
        frontEl.classList.remove('show');
        frontEl.innerHTML = '';
      }
    }
  }

  /**
   * 添加一手牌到顶部出牌历史（明示出过的牌）
   * @param {number} playerIndex - 玩家索引（0=你 1=小呆 2=老胡）
   * @param {Array} cards - 出的牌
   */
  addToHistory(playerIndex, cards) {
    if (!this.el.playHistory || !cards || cards.length === 0) return;
    
    const names = ['你', '小呆', '老胡'];
    const row = document.createElement('div');
    row.className = 'history-row';
    
    const nameEl = document.createElement('span');
    nameEl.className = 'history-player-name';
    nameEl.textContent = names[playerIndex] || ('P' + playerIndex);
    row.appendChild(nameEl);
    
    for (const card of cards) {
      const tiny = document.createElement('span');
      tiny.className = 'card-tiny';
      
      if (card.suit === 'joker') {
        const isBig = card.rank === 17;
        tiny.classList.add(isBig ? 'joker-big' : 'joker-small');
        tiny.textContent = isBig ? '🃏' : '🃏';
      } else {
        const display = cardDisplay(card);
        tiny.classList.add(display.isRed ? 'red' : 'black');
        tiny.textContent = display.display;
      }
      row.appendChild(tiny);
    }
    
    this.el.playHistory.appendChild(row);
    
    // 滚动到最新（保持最右侧/最新可见）
    this.el.playHistory.scrollTop = this.el.playHistory.scrollHeight;
  }

  /**
   * 清空出牌历史（新一局开始时调用）
   */
  clearPlayHistory() {
    if (this.el.playHistory) {
      this.el.playHistory.innerHTML = '';
    }
  }

  /**
   * 高亮提示牌
   */
  highlightHint(cards) {
    // 清除所有选中
    this.selectedIndices.clear();
    
    if (!cards || cards.length === 0) return;
    
    // 在高亮前先清除所有选中
    const cardElements = this.el.handCards.querySelectorAll('.card');
    cardElements.forEach(el => el.classList.remove('selected', 'hint-highlight'));
    
    // 找到这些牌对应的索引并选中
    for (const card of cards) {
      for (let i = 0; i < this.currentHand.length; i++) {
        const hc = this.currentHand[i];
        if (hc.suit === card.suit && hc.rank === card.rank) {
          this.selectedIndices.add(i);
          const cardEl = cardElements[i];
          if (cardEl) {
            cardEl.classList.add('selected', 'hint-highlight');
          }
          break;
        }
      }
    }
  }

  /**
   * 清除高亮
   */
  clearHighlight() {
    this.selectedIndices.clear();
    const cardElements = this.el.handCards.querySelectorAll('.card');
    cardElements.forEach(el => el.classList.remove('selected', 'hint-highlight'));
  }

  /**
   * 绑定事件
   */
  _bindEvents() {
    // BGM 切换（唯一控制入口：右上角按钮）
    // 打开弹窗时的手势解锁（main.js 的 tryStartBGM）负责"默认打开"，
    // 但用户手动关闭(mute)后，此按钮是唯一能重新打开的入口
    this.el.bgmToggle.addEventListener('click', () => {
      toggleBGM(); // 内部更新 bgmUserMuted 标志
      this.el.bgmToggle.textContent = isBGMPlaying() ? '🔊 音乐' : '🔇 音乐';
      if (this.el.bgmVolume) {
        this.el.bgmVolume.style.display = isBGMPlaying() ? 'inline-block' : 'none';
      }
    });
    
    // 音量滑块（仅当音乐播放时显示）
    if (this.el.bgmVolume) {
      this.el.bgmVolume.addEventListener('input', (e) => {
        const vol = parseFloat(e.target.value);
        setBGMVolume(vol);
      });
    }
    
    // 重新开始
    this.el.restartBtn.addEventListener('click', () => {
      location.reload();
    });
  }

  /**
   * 处理牌点击
   */
  _handleCardClick(index) {
    if (this.selectedIndices.has(index)) {
      this.selectedIndices.delete(index);
    } else {
      this.selectedIndices.add(index);
    }
    
    const cardElements = this.el.handCards.querySelectorAll('.card');
    cardElements.forEach((el, i) => {
      el.classList.remove('hover');
      if (this.selectedIndices.has(i)) {
        el.classList.add('selected');
      } else {
        el.classList.remove('selected');
      }
    });
  }

  /**
   * 获取选中的牌
   */
  _getSelectedCards() {
    const cards = [];
    for (const idx of this.selectedIndices) {
      if (this.currentHand[idx]) {
        cards.push(this.currentHand[idx]);
      }
    }
    return cards;
  }

  /**
   * 获取UI上有效的牌型
   */
  _getValidPlaysForUI(state) {
    // 通过全局的findValidPlays获取
    const hand = state.players[0].hand;
    const lastPlay = state.lastPlayer === 0 ? null : state.lastPlay;
    return findValidPlays(hand, lastPlay);
  }

  /**
   * 高亮当前玩家
   */
  _highlightCurrentPlayer(playerIndex, phase) {
    for (let i = 0; i < 3; i++) {
      const area = this.el.playerAreas[i];
      if (phase === 'playing' && i === playerIndex) {
        area.classList.add('active-player');
      } else {
        area.classList.remove('active-player');
      }
    }
  }

  /**
   * 获取头像颜色
   */
  _getAvatarColor(index) {
    const colors = ['#4CAF50', '#2196F3', '#FF9800'];
    return colors[index];
  }

  /**
   * 创建彩纸效果
   */
  _createConfetti() {
    const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ff8800', '#ff0088'];
    for (let i = 0; i < 50; i++) {
      const confetti = document.createElement('div');
      confetti.className = 'confetti';
      confetti.style.left = Math.random() * 100 + 'vw';
      confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      confetti.style.animationDuration = (2 + Math.random() * 3) + 's';
      confetti.style.animationDelay = Math.random() * 2 + 's';
      confetti.style.width = (5 + Math.random() * 10) + 'px';
      confetti.style.height = (5 + Math.random() * 10) + 'px';
      document.body.appendChild(confetti);
      
      // 自动移除
      setTimeout(() => confetti.remove(), 5000);
    }
  }
}

// ==================== 斗地主 - 背景音乐（原版mp3播放） ====================
// 使用小旭音乐《欢乐斗地主-游戏中1》原版 BGM（33秒循环播放）
// 通过 Web Audio API 播放（可复用 AudioContext 手势解锁，实现默认打开）

let audioCtx = null;
let isPlaying = false;
let bgmBuffer = null;      // 解码后的音频缓冲
let bgmSource = null;      // 当前播放源
let bgmGain = null;        // 音量控制节点
let bgmFetchStarted = false;
let bgmVolume = 0.35;      // 当前音量 (0-1)
let bgmUserMuted = false;  // 用户手动静音标志：true 时任何逻辑都不得自动播放

const BGM_URL = '/dou_dizhu_bgm.mp3';

/**
 * 初始化 AudioContext
 */
function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) {
    console.warn('Web Audio API not supported');
  }
}

/**
 * 加载并解码 BGM（只加载一次，带缓存）
 * @returns {Promise<AudioBuffer|null>}
 */
async function loadBGM() {
  if (bgmBuffer || bgmFetchStarted) return bgmBuffer;
  bgmFetchStarted = true;
  try {
    const res = await fetch(BGM_URL);
    const buf = await res.arrayBuffer();
    bgmBuffer = await audioCtx.decodeAudioData(buf);
  } catch (e) {
    console.warn('BGM 加载失败:', e);
    bgmBuffer = null;
  }
  return bgmBuffer;
}

/**
 * 开始播放背景音乐
 */
function startBGM() {
  if (isPlaying) return;
  if (bgmUserMuted) return; // 用户已静音则不播放

  initAudio();
  if (!audioCtx) return;

  // 恢复 AudioContext（手势解锁）
  if (audioCtx.state === 'suspended') {
    audioCtx.resume().catch(() => {});
  }

  isPlaying = true;

  loadBGM().then(buffer => {
    if (!buffer || !isPlaying) return;

    // 停止旧的播放源（如有）
    if (bgmSource) {
      try { bgmSource.stop(); } catch (e) {}
      try { bgmSource.disconnect(); } catch (e) {}
      bgmSource = null;
    }

    bgmSource = audioCtx.createBufferSource();
    bgmSource.buffer = buffer;
    bgmSource.loop = true;

    bgmGain = audioCtx.createGain();
    bgmGain.gain.value = bgmVolume;

    bgmSource.connect(bgmGain);
    bgmGain.connect(audioCtx.destination);
    bgmSource.start();
  });
}

/**
 * 停止播放背景音乐
 */
function stopBGM() {
  isPlaying = false;

  if (bgmSource) {
    try { bgmSource.stop(); } catch (e) {}
    try { bgmSource.disconnect(); } catch (e) {}
    bgmSource = null;
  }
}

/**
 * 切换背景音乐（用户手动操作：点击右上角按钮）
 * 关闭 = 记录用户静音，任何自动逻辑不得再启动
 */
function toggleBGM() {
  if (isPlaying) {
    stopBGM();
    bgmUserMuted = true;  // 用户点击关闭 → 永久静音直到再次手动打开
  } else {
    bgmUserMuted = false; // 用户手动打开 → 解除静音
    startBGM();
  }
}

/**
 * 是否正在播放
 */
function isBGMPlaying() {
  return isPlaying;
}

/**
 * 是否处于用户静音状态
 */
function isBGMUserMuted() {
  return bgmUserMuted;
}

/**
 * 设置背景音乐音量 (0-1)
 * @param {number} level - 音量值，0 到 1
 */
function setBGMVolume(level) {
  bgmVolume = Math.max(0, Math.min(1, level));
  if (bgmGain) {
    bgmGain.gain.value = bgmVolume;
  }
}

/**
 * 获取当前背景音乐音量
 * @returns {number} 当前音量 0-1
 */
function getBGMVolume() {
  return bgmVolume;
}

  '你': 'yue'          // 粤语女生
};

// 兼容旧引用（内部不再直接用，保留以免其他文件报错）
const SPEECH_LINES = ROLE_CONFIG['小呆'].lines;
const HUMAN_LINES = ROLE_CONFIG['你'].lines;

// ===== 开源 TTS 预生成音频（IndexTTS-2 主打 + CosyVoice2 彩蛋）=====
// IndexTTS-2（B站2025，自然度SOTA，方言克隆）生成主打台词到 /tts_cosy_it/
// CosyVoice2 生成彩蛋方言台词（粤语/四川腔）到 /tts_cosy/
const IT_MANIFEST_URL = '/tts_cosy_it/manifest.json';   // IndexTTS-2（优先）
const COSY_MANIFEST_URL = '/tts_cosy/manifest.json';    // CosyVoice2 彩蛋（回退）
const COSY_VOICE_MAP = { '小呆': 'xiaodai', '老胡': 'laohu', '你': 'human' };
let itManifest = null;
let cosyManifest = null;
let cosyEnabled = false;

/**
 * 加载预生成音频清单（IndexTTS-2 + CosyVoice2 两份）
 */
function loadCosyManifest() {
  return Promise.all([
    fetch(IT_MANIFEST_URL, { mode: 'cors' }).then(r => r.ok ? r.json() : null).catch(() => null),
    fetch(COSY_MANIFEST_URL, { mode: 'cors' }).then(r => r.ok ? r.json() : null).catch(() => null)
  ]).then(([itM, cosyM]) => {
    itManifest = itM && Object.keys(itM).length > 0 ? itM : null;
    cosyManifest = cosyM && Object.keys(cosyM).length > 0 ? cosyM : null;
    cosyEnabled = !!(itManifest || cosyManifest);
    return cosyEnabled;
  });
}

/**
 * 尝试用预生成音频播放（IndexTTS-2 优先，CosyVoice2 彩蛋回退）
 * @param {string} roleName - 角色名（小呆/老胡/你）
 * @param {string} text - 台词文本
 * @returns {boolean} 是否命中预生成音频
 */
// 预生成 wav 的 blob 缓存（url -> objectURL），绕过服务器 application/octet-stream 导致的播放失败
const wavBlobCache = {};

/**
 * 用 fetch+blob 播放预生成 wav（强制 audio/wav，绕过服务器错误的 Content-Type）
 * 服务器对 .wav 返回 application/octet-stream，直接 new Audio(url) 流式播放会 NotSupportedError；
 * fetch 成 blob 并指定 audio/wav 后用 objectURL 播放即可正常。
 * @param {string} url - wav 完整路径
 * @param {Function} [onFail] - fetch/播放失败时的降级回调（如 Web Speech）
 */
function playWavAsBlob(url, onFail) {
  if (wavBlobCache[url]) { enqueueAudio(wavBlobCache[url]); return; }
  fetch(url)
    .then(r => { if (!r.ok) throw new Error('http ' + r.status); return r.blob(); })
    .then(blob => {
      const typed = new Blob([blob], { type: 'audio/wav' });
      const objUrl = URL.createObjectURL(typed);
      wavBlobCache[url] = objUrl;
      enqueueAudio(objUrl);
    })
    .catch(() => { if (onFail) onFail(); });
}

function speakViaCosy(roleName, text, voiceKey) {
  if (!cosyEnabled) return false;
  // 优先用 voiceKey（laohu/xiaodai/human，新角色按 voice 映射），否则按角色名查 COSY_VOICE_MAP
  const voicePrefix = voiceKey || COSY_VOICE_MAP[roleName];
  if (!voicePrefix) return false;
  const cosyKey = voicePrefix + '_' + text;
  const fallback = () => speakViaWebSpeech(text, 1.0, 1.0);
  // 1. IndexTTS-2.5（方言克隆+情绪，最自然）
  if (itManifest && itManifest[cosyKey]) {
    playWavAsBlob('/tts_cosy_it/' + itManifest[cosyKey], fallback);  // manifest 值是文件名，需加 /tts_cosy_it/ 前缀
    return true;
  }
  // 2. CosyVoice2（彩蛋方言：粤语/四川）
  if (cosyManifest && cosyManifest[cosyKey]) {
    playWavAsBlob('/tts_cosy/' + cosyManifest[cosyKey], fallback);   // 加 /tts_cosy/ 前缀
    return true;
  }
  return false;
}

const TTS_SERVER = 'http://127.0.0.1:3098';
let ttsServerAvailable = false;
let ttsServerChecked = false;

// Web Speech API 降级
let speechSynth = null;
let bestChineseVoice = null;
let allChineseVoices = [];
let voiceReady = false;
let lastSpeakTime = 0;

// 音频缓存 { key: blobUrl }
const audioCache = {};
// 播放队列，防止语音重叠
const playQueue = [];
let isPlayingAudio = false;

/**
 * 检查 TTS 服务器是否可用
 */
function checkTTSServer() {
  return new Promise((resolve) => {
    fetch(TTS_SERVER + '/health', { mode: 'cors' })
      .then(r => {
        ttsServerAvailable = r.ok;
        ttsServerChecked = true;
        resolve(ttsServerAvailable);
      })
      .catch(() => {
        ttsServerAvailable = false;
        ttsServerChecked = true;
        resolve(false);
      });
  });
}

/**
 * 预热 TTS 缓存：为每个角色预生成其方言台词，确保出牌时语音即时播放
 */
function prewarmTTS() {
  if (!ttsServerAvailable) return;
  for (const roleName of Object.keys(ROLE_CONFIG)) {
    const role = ROLE_CONFIG[roleName];
    const voice = role.voice;
    const phrases = new Set();
    Object.values(role.lines).forEach(arr => arr.forEach(p => phrases.add(p)));
    for (const text of phrases) {
      const cacheKey = voice + '_' + text;
      if (!audioCache[cacheKey]) {
        const url = TTS_SERVER + '/tts?text=' + encodeURIComponent(text) + '&voice=' + encodeURIComponent(voice);
        fetch(url, { mode: 'cors' })
          .then(r => r.blob())
          .then(blob => {
            audioCache[cacheKey] = URL.createObjectURL(blob);
          })
          .catch(() => {});
      }
    }
  }
  console.log('[TTS] 预热完成，方言语音已缓存');
}

/**
 * 通过 TTS 服务器生成语音，立即返回，音频就绪后播放
 */
function speakViaTTS(text, voiceKey) {
  if (!ttsServerAvailable) return;
  
  const cacheKey = voiceKey + '_' + text;
  if (audioCache[cacheKey]) {
    enqueueAudio(audioCache[cacheKey]);
    return;
  }
  
  const url = TTS_SERVER + '/tts?text=' + encodeURIComponent(text) + '&voice=' + encodeURIComponent(voiceKey);
  fetch(url, { mode: 'cors' })
    .then(r => r.blob())
    .then(blob => {
      const blobUrl = URL.createObjectURL(blob);
      audioCache[cacheKey] = blobUrl;
      enqueueAudio(blobUrl);
    })
    .catch(() => {
      speakViaWebSpeech(text, 1.0, 1.0);
    });
}

/**
 * 音频播放队列：串行播放，避免语音重叠
 */
function enqueueAudio(url) {
  playQueue.push(url);
  processQueue();
}

function processQueue() {
  if (isPlayingAudio || playQueue.length === 0) return;
  isPlayingAudio = true;
  const url = playQueue.shift();
  const audio = new Audio(url);
  audio.volume = 0.8;
  audio.onended = () => {
    isPlayingAudio = false;
    processQueue();
  };
  audio.play().catch(() => {
    isPlayingAudio = false;
    processQueue();
  });
}

/**
 * 通过 Web Speech API 说话（降级方案）
 */
function speakViaWebSpeech(text, rate, pitch) {
  if (!speechSynth) {
    if (!initSpeech()) return;
  }
  if (speechSynth.speaking) {
    speechSynth.cancel();
  }
  const now = Date.now();
  if (now - lastSpeakTime < 300) return;
  lastSpeakTime = now;
  try {
    const utterance = new SpeechSynthesisUtterance(text);
    if (bestChineseVoice) utterance.voice = bestChineseVoice;
    else if (allChineseVoices.length > 0) utterance.voice = allChineseVoices[0];
    utterance.lang = 'zh-CN';
    utterance.rate = rate;
    utterance.pitch = pitch;
    utterance.volume = 0.9;
    speechSynth.speak(utterance);
  } catch (e) {}
}

/**
 * 初始化语音合成
 */
function initSpeech() {
  // 加载 CosyVoice2 预生成方言音频清单
  loadCosyManifest();
  
  checkTTSServer().then(() => {
    if (ttsServerAvailable) {
      prewarmTTS(); // 服务器可用则预热
    }
  });
  
  if (!window.speechSynthesis) return false;
  speechSynth = window.speechSynthesis;
  const loadVoices = () => {
    const voices = speechSynth.getVoices();
    if (voices.length > 0) {
      allChineseVoices = voices.filter(v => v.lang.startsWith('zh'));
      const preferred = ['Microsoft Xiaoxiao', 'Microsoft Yunxi', 'Microsoft Yunyang', 'Microsoft Yaoyao', 'Google 普通话', 'Google 中文', 'Sin-Ji', 'zh-CN', 'zh-TW', 'zh-HK'];
      for (const name of preferred) {
        const found = allChineseVoices.find(v => v.name.includes(name));
        if (found) { bestChineseVoice = found; break; }
      }
      if (!bestChineseVoice && allChineseVoices.length > 0) bestChineseVoice = allChineseVoices[0];
      voiceReady = true;
    }
  };
  loadVoices();
  if (!voiceReady) speechSynth.onvoiceschanged = () => { loadVoices(); };
  return true;
}

/**
 * 获取语音状态
 */
function getVoiceStatus() {
  return {
    ttsServer: ttsServerAvailable,
    webSpeech: voiceReady,
    voiceName: bestChineseVoice ? bestChineseVoice.name : '无',
    voiceCount: allChineseVoices.length,
    cacheCount: Object.keys(audioCache).length,
    cosyEnabled: cosyEnabled,
    cosyLines: (itManifest ? Object.keys(itManifest).length : 0) + (cosyManifest ? Object.keys(cosyManifest).length : 0),
    itLines: itManifest ? Object.keys(itManifest).length : 0,
    cvLines: cosyManifest ? Object.keys(cosyManifest).length : 0,
    roles: Object.keys(ROLE_CONFIG).map(name => name + '(' + ROLE_CONFIG[name].tag + ':' + ROLE_CONFIG[name].voice + ')')
  };
}

/**
 * 统一说话接口（优先 CosyVoice2 预生成方言音频，其次 edge-tts，最后 Web Speech）
 * @param {string} text - 台词
 * @param {number} rate - 语速
 * @param {number} pitch - 音调
 * @param {string} voiceKey - edge-tts 声源 key
 * @param {string} roleName - 角色名（小呆/老胡/你），用于 CosyVoice 方言音频
 */
function speak(text, rate = 1.0, pitch = 1.0, voiceKey = 'xiaoxiao', roleName = null, cosyVoice = null) {
  // 优先使用预生成的方言音频（最有人情味）；cosyVoice 是新角色的语音映射（laohu/xiaodai/human）
  if ((roleName || cosyVoice) && speakViaCosy(roleName, text, cosyVoice)) return;
  if (ttsServerAvailable) {
    speakViaTTS(text, voiceKey);
  } else {
    speakViaWebSpeech(text, rate, pitch);
  }
}

function _randomLine(lines) {
  if (!lines || !lines.length) return '出牌！';
  return lines[Math.floor(Math.random() * lines.length)];
}

/** 取角色台词库 */
function _roleLines(playerName, cosyVoice) {
  const role = ROLE_CONFIG[playerName];
  if (role) return role;
  // 新角色（随机对手）：按 voice 映射到现有语音库（台词库复用）
  if (cosyVoice === 'laohu') return ROLE_CONFIG['老胡'];
  if (cosyVoice === 'xiaodai') return ROLE_CONFIG['小呆'];
  // 兜底：老胡台词库完整（含全部牌型行），避免落到只有 play/pass 的'你'导致牌型行缺失
  return ROLE_CONFIG['老胡'];
}

/** AI 出牌说话（按角色方言/性格） */
function speakPlay(playerName, cardType, cards, cosyVoice) {
  const role = _roleLines(playerName, cosyVoice);
  const lines = role.lines;
  let line = '';
  switch (cardType) {
    case CARD_TYPE.SINGLE: line = _randomLine(lines.single); break;
    case CARD_TYPE.PAIR: line = _randomLine(lines.pair); break;
    case CARD_TYPE.TRIPLE: line = _randomLine(lines.triple); break;
    case CARD_TYPE.TRIPLE_ONE: line = _randomLine(lines.tripleOne); break;
    case CARD_TYPE.TRIPLE_TWO: line = _randomLine(lines.tripleTwo); break;
    case CARD_TYPE.STRAIGHT: line = _randomLine(lines.straight); break;
    case CARD_TYPE.DOUBLE_STRAIGHT: line = _randomLine(lines.doubleStraight); break;
    case CARD_TYPE.PLANE:
    case CARD_TYPE.PLANE_SINGLE:
    case CARD_TYPE.PLANE_PAIR:
      if (cardType === CARD_TYPE.PLANE) line = _randomLine(lines.plane);
      else if (cardType === CARD_TYPE.PLANE_SINGLE) line = _randomLine(lines.planeSingle);
      else line = _randomLine(lines.planePair);
      break;
    case CARD_TYPE.BOMB: line = _randomLine(lines.bomb); break;
    case CARD_TYPE.ROCKET: line = _randomLine(lines.rocket); break;
    default: line = '出牌！';
  }
  speak(line, 1.0, 1.0, role.voice, playerName, cosyVoice);
}

/** AI 过牌说话（按角色） */
function speakPass(playerName, cosyVoice) {
  const role = _roleLines(playerName, cosyVoice);
  speak(_randomLine(role.lines.pass), 1.0, 1.0, role.voice, playerName, cosyVoice);
}

/** AI 叫牌说话（按角色） */
function speakBid(playerName, score, cosyVoice) {
  const role = _roleLines(playerName, cosyVoice);
  speak(score > 0 ? _randomLine(role.lines.bid) : _randomLine(role.lines.noBid), 1.0, 1.0, role.voice, playerName, cosyVoice);
}

/** AI 赢牌说话（按角色） */
function speakWin(playerName, cosyVoice) {
  const role = _roleLines(playerName, cosyVoice);
  speak(_randomLine(role.lines.win), 1.0, 1.0, role.voice, playerName, cosyVoice);
}

/** AI 输牌说话（按角色） */
function speakLose(playerName, cosyVoice) {
  const role = _roleLines(playerName, cosyVoice);
  speak(_randomLine(role.lines.lose), 1.0, 1.0, role.voice, playerName, cosyVoice);
}

/* ============ 人类玩家语音（普通话） ============ */

/** 人类玩家出牌说话 */
function speakHumanPlay() {
  const role = ROLE_CONFIG['你'];

/** 人类玩家叫牌说话 */
function speakHumanBid(score) {

/** 人类玩家胜利说话 */
function speakHumanWin() {

// ==================== 斗地主 - 主入口 ====================

let game = null;
let renderer = null;
let isProcessing = false;
let hintPlays = [];
let hintIndex = 0;

// 人类玩家回合 30 秒超时（到时间未操作自动过牌/不叫）
const HUMAN_TURN_LIMIT = 30; // 秒
let humanTimer = null;       // 兜底定时器
let humanCountdown = null;   // 倒计时显示定时器

/**
 * 启动人类玩家回合倒计时（30秒）
 */
function startHumanTurnTimer() {
  clearHumanTurnTimer();
  let remain = HUMAN_TURN_LIMIT;
  updateHumanCountdown(remain);
  humanCountdown = setInterval(() => {
    remain--;
    if (remain <= 0) {
      clearHumanTurnTimer();
      autoHumanAction();
    } else {
      updateHumanCountdown(remain);
    }
  }, 1000);
  humanTimer = setTimeout(() => {
    clearHumanTurnTimer();
    autoHumanAction();
  }, HUMAN_TURN_LIMIT * 1000);
}

/**
 * 更新倒计时显示
 */
function updateHumanCountdown(remain) {
  if (!renderer || !game) return;
  const msg = game.phase === 'bidding' ? '请叫分' : '请出牌';
  renderer.showMessage(`⏳ 轮到你了，${msg}（${remain}s 后自动操作）`);
}

/**
 * 清除人类回合定时器
 */
function clearHumanTurnTimer() {
  if (humanTimer) { clearTimeout(humanTimer); humanTimer = null; }
  if (humanCountdown) { clearInterval(humanCountdown); humanCountdown = null; }
}

/**
 * 超时自动操作：出牌阶段能过就过，不能过就出最小可出牌；叫牌阶段自动不叫
 */
function autoHumanAction() {
  if (isProcessing) return;
  if (game.phase === 'bidding' && game.currentPlayer === 0) {
    handleHumanBid(0); // 超时自动不叫
  } else if (game.phase === 'playing' && game.currentPlayer === 0) {
    if (game.lastPlayer === 0 || game.lastPlayer === -1) {
      autoPlaySmallest(); // 首出/自由出：必须出牌，自动出最小一组
    } else {
      handleHumanPass(); // 超时自动不出
    }
  }
}

/**
 * 自动出最小的可出牌（自由出牌时超时的兜底）
 */
function autoPlaySmallest() {
  const validPlays = game.getValidPlays();
  if (validPlays.length > 0) {
    handleHumanPlay(validPlays[0]);
    return;
  }
  const hand = game.players[0].hand;
  if (hand.length > 0) {
    const smallest = hand.slice().sort((a, b) => a.rank - b.rank)[0];
    handleHumanPlay([smallest]);
  }
}

/**
 * 初始化游戏
 */
function initGame() {
  game = new Game();
  renderer = new Renderer();
  
  // 初始化语音
  initSpeech();
  
  // 监听父页面手势消息（用户点击🃏打开弹窗 = 用户手势）
  // 用于解除 iframe 音频自动播放限制，实现背景音乐默认打开
  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'DOUDIZHU_USER_GESTURE') {
      tryStartBGM();
    }
  });
  
  // 设置回调
  game.onStateChange = (state) => {
    renderer.renderState(state);
    
    // 自动触发AI回合
    if (!isProcessing) {
      if (state.phase === 'bidding' && state.currentPlayer !== 0) {
        setTimeout(() => processAIBidding(), 100);
      } else if (state.phase === 'playing' && state.currentPlayer !== 0) {
        setTimeout(() => processAITurn(), 200);
      } else if (state.phase === 'bidding' && state.currentPlayer === 0) {
        // 轮到人类叫牌（开局），启动30秒倒计时
        startHumanTurnTimer();
      }
    }
  };
  
  game.onBidEnd = (landlordIndex) => {
    // 地主确定后说话
    setTimeout(() => {
      if (landlordIndex === 0) {
        speakHumanBid(3);
      } else {
        speakBid(game.players[landlordIndex].name, 3, game.players[landlordIndex].voice);
      }
    }, 500);
  };
  
  game.onGameEnd = (winnerIndex) => {
    // 语音播报（区分人类/AI）
    setTimeout(() => {
      const winner = game.players[winnerIndex];
      if (winnerIndex === 0) speakHumanWin();
      else speakWin(winner.name, winner.voice);
      
      // 输家说话
      for (let i = 0; i < 3; i++) {
        if (i !== winnerIndex) {
          setTimeout(() => {
            if (i === 0) speakHumanLose();
            else speakLose(game.players[i].name, game.players[i].voice);
          }, 1800);
        }
      }
    }, 500);
  };
  
  // 设置渲染器回调
  renderer.onPlay = (cards) => {
    handleHumanPlay(cards);
  };
  
  renderer.onPass = () => {
    handleHumanPass();
  };
  
  renderer.onBid = (score) => {
    handleHumanBid(score);
  };
  
  renderer.onHint = () => {
    handleHumanHint();
  };
  
  // 开始游戏
  game.startGame();
}

/**
 * 处理人类玩家出牌
 */
function handleHumanPlay(cards) {
  if (isProcessing) return;
  if (game.phase !== 'playing') return;
  if (game.currentPlayer !== 0) return;
  
  // 验证牌型
  const type = detectType(cards);
  if (!type) {
    renderer.showMessage('❌ 无效的牌型！');
    return;
  }
  
  // 检查是否能管上
  if (game.lastPlay && game.lastPlayer !== 0) {
    const lastPlayInfo = {
      cards: game.lastPlay.cards,
      type: game.lastPlay.type,
      rank: game.lastPlay.rank,
      length: game.lastPlay.length
    };
    if (!canBeat(cards, lastPlayInfo)) {
      renderer.showMessage('❌ 管不上！');
      return;
    }
  }
  
  isProcessing = true;
  
  // 先说话（TTS 预热后即时播放），再出牌动画，保证同步；语音异常不能卡死流程
  const playType = detectType(cards);
  try {
    speakHumanPlay();
  } catch (e) {
    console.error('[人类出牌语音异常]', e);
  }
  
  // 出牌动画
  renderer.animatePlayCards(0, cards);
  
  const success = game.handlePlay(0, cards);
  if (!success) {
    renderer.showMessage('❌ 出牌失败！');
    isProcessing = false;
    return;
  }
  
  renderer.clearHighlight();
  clearHumanTurnTimer(); // 人类已操作，清除倒计时
  
  // 检查游戏是否结束
  if (game.phase === 'ended') {
    isProcessing = false;
    return;
  }
  
  // AI 回合
  setTimeout(() => {
    isProcessing = false;
    processAITurn();
  }, 400);
}

/**
 * 处理人类玩家过牌
 */
function handleHumanPass() {
  if (isProcessing) return;
  if (game.phase !== 'playing') return;
  if (game.currentPlayer !== 0) return;
  if (game.lastPlayer === 0 || game.lastPlayer === -1) return;
  
  isProcessing = true;
  
  // 人类玩家过牌说话；语音异常不能卡死流程
  try {
    speakHumanPass();
  } catch (e) {
    console.error('[人类过牌语音异常]', e);
  }
  
  const success = game.handlePlay(0, []);
  if (!success) {
    isProcessing = false;
    return;
  }
  
  renderer.clearHighlight();
  clearHumanTurnTimer(); // 人类已操作，清除倒计时
  renderer.showMessage('不出');
  
  if (game.phase === 'ended') {
    isProcessing = false;
    return;
  }
  
  setTimeout(() => {
    isProcessing = false;
    processAITurn();
  }, 400);
}

/**
 * 处理人类玩家叫地主
 */
function handleHumanBid(score) {
  if (isProcessing) return;
  if (game.phase !== 'bidding') return;
  if (game.currentPlayer !== 0) return;
  
  isProcessing = true;
  
  // 人类玩家叫牌说话
  speakHumanBid(score);
  
  const success = game.handleBid(0, score);
  if (!success) {
    isProcessing = false;
    return;
  }
  
  clearHumanTurnTimer(); // 人类已操作，清除倒计时
  renderer.hideBiddingUI();
  
  if (score > 0) {
    renderer.showMessage(`你叫了 ${score} 分`);
  } else {
    renderer.showMessage('你不叫');
  }
  
  // 检查游戏是否进入出牌阶段
  if (game.phase === 'playing') {
    // 地主确定，开始出牌
    if (game.currentPlayer === 0) {
      isProcessing = false;
      startHumanTurnTimer(); // 轮到人类出牌，启动30秒倒计时
      return;
    } else {
      // AI 出牌
      setTimeout(() => {
        isProcessing = false;
        processAITurn();
      }, 500);
    }
    return;
  }
  
  // 继续叫地主（AI回合）
  setTimeout(() => {
    isProcessing = false;
    processAIBidding();
  }, 500);
}

/**
 * 处理人类玩家提示
 */
function handleHumanHint() {
  if (game.phase !== 'playing') return;
  if (game.currentPlayer !== 0) return;
  
  const validPlays = game.getValidPlays();
  
  if (validPlays.length === 0) {
    renderer.showMessage('没有能出的牌');
    return;
  }
  
  // 不选中任何牌，直接提示到下一组
  if (hintPlays.length === 0) {
    hintPlays = validPlays;
    hintIndex = 0;
  } else {
    hintIndex = (hintIndex + 1) % hintPlays.length;
  }
  
  const hintCards = hintPlays[hintIndex];
  renderer.highlightHint(hintCards);
  
  const type = detectType(hintCards);
  if (type) {
    renderer.showMessage(`提示: ${getTypeName(type.type)}`);
  }
}

/**
 * AI 叫地主流程
 */
function processAIBidding() {
  if (isProcessing) return;
  if (game.phase !== 'bidding') return;
  if (game.currentPlayer === 0) return;
  
  isProcessing = true;
  
  const playerIndex = game.currentPlayer;
  const player = game.players[playerIndex];
  const hand = player.hand;
  
  // 获取当前最高叫分
  const currentBid = game.bidHistory.length > 0 
    ? Math.max(...game.bidHistory.map(b => b.score))
    : 0;
  
  const score = decideBid(hand, currentBid, player.personality);
  
  const delay = getAIBidDelay();
  
  setTimeout(() => {
    // 防御：AI 叫牌异常也不能卡死流程
    try {
      if (game.phase !== 'bidding') {
        isProcessing = false;
        return;
      }
      
      const success = game.handleBid(playerIndex, score);
      if (!success) {
        isProcessing = false;
        return;
      }
      
      // AI 说话
      speakBid(player.name, score, player.voice);
      
      if (score > 0) {
        renderer.showMessage(`${player.name} 叫了 ${score} 分`);
      } else {
        renderer.showMessage(`${player.name} 不叫`);
      }
      
      if (game.phase === 'playing') {
        // 地主确定，开始出牌
        if (game.currentPlayer === 0) {
          isProcessing = false;
          startHumanTurnTimer(); // 轮到人类出牌，启动30秒倒计时
          return;
        } else {
          setTimeout(() => {
            isProcessing = false;
            processAITurn();
          }, 500);
        }
        return;
      }
      
      if (game.phase === 'bidding') {
        // 继续叫地主（可能是人类或AI）
        if (game.currentPlayer === 0) {
          isProcessing = false;
        startHumanTurnTimer(); // 轮到人类叫分，启动30秒倒计时
      } else {
        setTimeout(() => {
          isProcessing = false;
          processAIBidding();
        }, 300);
      }
    }
    } catch (err) {
      console.error('[AI叫牌异常]', err);
      // 异常也要推进：清 isProcessing 并继续叫牌/出牌调度
      if (game.phase === 'bidding' && game.currentPlayer !== 0) {
        isProcessing = false;
        setTimeout(() => processAIBidding(), 500);
      } else {
        isProcessing = false;
      }
    }
  }, delay);
}

/**
 * AI 出牌流程
 */
function processAITurn() {
  if (isProcessing) return;
  if (game.phase !== 'playing') return;
  if (game.currentPlayer === 0) return;
  
  isProcessing = true;
  
  const playerIndex = game.currentPlayer;
  const player = game.players[playerIndex];
  const hand = player.hand;
  const isLandlord = player.isLandlord;
  
  const lastPlay = game.lastPlayer === playerIndex ? null : game.lastPlay;
  const lastPlayer = game.lastPlayer;
  
  const delay = getAIDelay();
  
  setTimeout(() => {
    // 防御：AI 回合处理中任何异常都不能让 isProcessing 卡死（否则游戏停摆）
    try {
      if (game.phase !== 'playing') {
        isProcessing = false;
        return;
      }
      
      const cards = choosePlay(hand, lastPlay, lastPlayer, isLandlord, playerIndex, game.landlord, player.personality);
      
      const isPass = !cards || cards.length === 0;
      
      if (isPass) {
        // 先说话再过牌
        speakPass(player.name, player.voice);
        
        const success = game.handlePlay(playerIndex, []);
        if (!success) {
          isProcessing = false;
          return;
        }
        
        renderer.showMessage(`${player.name}: 过`);
        
        if (game.phase === 'ended') {
          isProcessing = false;
          return;
        }
        
        if (game.currentPlayer === 0) {
          resetHintState();
          startHumanTurnTimer(); // 轮到人类出牌，启动30秒倒计时
          isProcessing = false;
        } else {
          setTimeout(() => {
            isProcessing = false;
            processAITurn();
          }, 500);
        }
      } else {
        // 先说话（TTS 即时播放）再出牌动画，保证同步
        const type = detectType(cards);
        speakPlay(player.name, type ? type.type : '', cards, player.voice);
        
        renderer.animatePlayCards(playerIndex, cards);
        
        const success = game.handlePlay(playerIndex, cards);
        if (!success) {
          isProcessing = false;
          return;
        }
        
        renderer.showMessage(`${player.name} 出牌`);
        
        if (game.phase === 'ended') {
          isProcessing = false;
          return;
        }
        
        if (game.currentPlayer === 0) {
          resetHintState();
          startHumanTurnTimer(); // 轮到人类出牌，启动30秒倒计时
          isProcessing = false;
        } else {
          setTimeout(() => {
            isProcessing = false;
            processAITurn();
          }, 500);
        }
      }
    } catch (err) {
      console.error('[AI回合异常]', err);
      // 异常也要推进游戏：清 isProcessing 并继续调度下一回合
      if (game.phase === 'playing' && game.currentPlayer !== 0) {
        isProcessing = false;
        setTimeout(() => processAITurn(), 600);
      } else {
        isProcessing = false;
      }
    }
  }, delay);
}

/**
 * 重置提示状态
 */
function resetHintState() {
  hintPlays = [];
  hintIndex = 0;
}

/**
 * 尝试启动背景音乐（打开弹窗时自动调用）
 * 用户已手动静音（bgmUserMuted=true）时不得再播放
 */
function tryStartBGM() {
  if (isBGMUserMuted()) return; // 用户已静音，禁止自动播放
  if (!isBGMPlaying()) {
    startBGM();
    if (renderer) {
      renderer.el.bgmToggle.textContent = '🔊 音乐';
      if (renderer.el.bgmVolume) {
        renderer.el.bgmVolume.style.display = 'inline-block';
      }
    }
  }
}

// 页面加载完成后初始化
window.addEventListener('DOMContentLoaded', () => {
  initGame();
});
