<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>斗地主新配音基准音色试听（CosyVoice3）</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #1a1a2e; color: #eee; padding: 20px; max-width: 800px; margin: 0 auto; }
    h1 { color: #ffd700; }
    .role { background: #16213e; border: 2px solid #ffd700; border-radius: 12px; padding: 16px; margin: 16px 0; }
    .role h2 { color: #ffd700; margin: 0 0 4px; }
    .role .desc { color: #aaa; font-size: 13px; margin-bottom: 10px; }
    .role .text { color: #7fdbca; font-size: 14px; margin-bottom: 10px; font-style: italic; }
    audio { width: 100%; height: 40px; }
    .tag { display: inline-block; background: #0f3460; color: #ffd700; font-size: 11px; padding: 2px 8px; border-radius: 4px; margin-right: 6px; }
    .tip { background: #0f3460; padding: 12px; border-radius: 8px; margin-top: 20px; font-size: 13px; color: #ccc; }
  </style>
</head>
<body>
  <h1>🎙️ 斗地主新配音 · 基准音色试听</h1>
  <p style="color:#aaa">CosyVoice3 文字描述生成（方言+性格+年龄），3 个方言 NPC 基准音色</p>

  <div class="role">
    <h2>🧔 东北大叔（老胡）</h2>
    <div><span class="tag">50岁</span><span class="tag">粗犷豪爽</span><span class="tag">东北口音</span><span class="tag">中年男性</span></div>
    <div class="text">"看我东北大炮，轰得你找不着北！"</div>
    <audio controls src="voice_preview/dongbei_base.wav"></audio>
  </div>

  <div class="role">
    <h2>👩 四川大妈（小呆）</h2>
    <div><span class="tag">45岁</span><span class="tag">泼辣爽利</span><span class="tag">四川方言</span><span class="tag">中年女性</span></div>
    <div class="text">"要得！这把牌巴适得板，看哪个敢跟老子抢！"</div>
    <audio controls src="voice_preview/sichuan_base.wav"></audio>
  </div>

  <div class="role">
    <h2>👧 粤语女生（你）</h2>
    <div><span class="tag">20岁</span><span class="tag">清脆活泼</span><span class="tag">广东粤语</span><span class="tag">年轻女性</span></div>
    <div class="text">"哈哈，呢把牌好靓啊，实赢冇得输！"</div>
    <audio controls src="voice_preview/cantonese_base.wav"></audio>
  </div>

  <div class="tip">
    💡 <b>试听确认后</b>，我将用 IndexTTS-2.5 对这些基准音色做<b>情绪微调</b>（赢牌得意大笑、输牌叹气、出牌干脆、炸弹兴奋），批量生成全部斗地主台词，替换现有配音。
  </div>
</body>
</html>
